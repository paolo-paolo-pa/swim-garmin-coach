[project]
name = "garmin-coach"
version = "0.1.0"
description = "Allenatore di nuoto personale, locale, sui dati Garmin"
requires-python = ">=3.12"
# Dipendenze di esecuzione. Vanno dichiarate tutte: un ambiente ricostruito
# da questo file deve produrre lo stesso database, non uno che manca dei FIT
# perche un pacchetto era stato installato a mano (criterio D0).
dependencies = [
    "duckdb>=1.5",
    "mcp>=1.0",
    "fitdecode>=0.10",      # lettura dei file FIT dell'orologio (Fase 5)
    "garminconnect>=0.2",   # sincronizzazione da Garmin Connect (Fase 3)
    "garmin-connect-personal-api-python==1.0.0", # client ufficiale, sola lettura
    "tzdata>=2026.1",       # fuso Europe/Rome disponibile anche su Windows
    # L'applicazione web locale. Arrivavano gia di rimbalzo come dipendenze di
    # `mcp`: appoggiarsi a una dipendenza transitiva e la fragilita che D0
    # doveva togliere, quindi sono dichiarate (correzione C1 del secondo audit
    # della Macro-proposta 4). Nessuna delle due contatta la rete: il server
    # ascolta solo su 127.0.0.1.
    "starlette>=0.37",      # routing e form dell'app locale (Macro-proposta 4)
    "uvicorn>=0.29",        # il server che la tiene aperta
    "httpx>=0.27,<1",       # proxy locale di sola lettura per il link condiviso
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
